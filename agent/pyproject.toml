[project]
name = "fairsettle-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["httpx==0.28.1", "pydantic==2.12.5", "litellm==1.106.5", "openai==2.54.0", "langgraph==1.2.18", "langgraph-checkpoint==4.3.1", "langgraph-checkpoint-postgres==3.2.0", "psycopg[binary]==3.3.6", "psycopg-pool==3.3.3"]

[dependency-groups]
dev = ["pytest==9.0.2", "testcontainers[postgres]==4.15.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
