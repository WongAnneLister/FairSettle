services:
  database:
    # Pinned rather than floating on `postgres:latest`: an untagged image means
    # the database engine can change underneath the project between two runs of
    # `docker compose up`.
    image: 'postgres:16-alpine'
    restart: always
    environment:
      - POSTGRES_USER=adminer
      - POSTGRES_PASSWORD=secret123
      - POSTGRES_DB=food_delivery
    ports:
      - '5432:5432'
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adminer -d food_delivery']
      interval: 5s
      timeout: 5s
      retries: 10
